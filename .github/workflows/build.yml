# 自动打包：推送 v 开头的标签（如 v1.0）时，在 Windows 上打包 exe 并发布到 Releases
name: 打包 exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name SnowDesktop snow_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: snow-desktop-exe
          path: dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
